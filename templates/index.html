<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitFlow | Elevate Your Day</title>
    <link rel="stylesheet" href="../style.css">
</head>
<style>
    /* Universal Reset */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --primary: #6c5ce7;
        --accent: #00d2ff;
        --danger: #ff7675;
        --glass: rgba(255, 255, 255, 0.12);
        --text: #ffffff;
    }

    body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #e6e6fa 0%, #b57edc 100%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        display: flex;
    }

    header {
        text-align: center;
        padding: 40px 20px;
    }

    .logo {
        font-size: 2.5rem;
        font-weight: 800;
        letter-spacing: -1px;
        background: linear-gradient(to right, #a29bfe, #00d2ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .container {
        max-width: 900px;
        margin: 0 auto;
        width: 95%;
        flex: 1;
    }

    /* Input Styles */
    .input-area {
        display: flex;
        gap: 10px;
        margin-bottom: 40px;
    }

    input {
        flex: 1;
        padding: 15px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.1);
        background: var(--glass);
        color: white;
        outline: none;
    }

    button {
        padding: 0 25px;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.3s ease;
    }

    .btn-add { background: var(--primary); color: white; }
    .btn-clear { background: rgba(255,255,255,0.05); color: var(--danger); border: 1px solid var(--danger); }

    

    /* Dashboard Columns */
    .dashboard {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 25px;
    }

    .column {
        background: var(--glass);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 25px;
        border: 1px solid rgba(255,255,255,0.05);
    }

    .column h2 {
        font-size: 1.2rem;
        margin-bottom: 20px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 10px;
    }

    /* Habit Items */
    .habit-item {
        background: rgba(0,0,0,0.2);
        margin-bottom: 12px;
        padding: 15px;
        border-radius: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-left: 4px solid var(--primary);
    }

    .streak-badge {
        display: inline-block;
        margin-left: 10px;
        background: #ffeaa7;
        color: #d35400;
        padding: 2px 8px;
        border-radius: 6px;
        font-size: 0.75rem;
    }

    /* Graph */
    .stats-container {
        margin: 40px 0;
        background: var(--glass);
        padding: 30px;
        border-radius: 20px;
    }

    .graph {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        height: 120px;
        margin-top: 30px;
        padding: 0 10px;
    }

    .bar {
        width: 12%;
        background: var(--primary);
        border-radius: 4px;
        position: relative;
        transition: height 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .bar::after {
        content: attr(data-day);
        position: absolute;
        bottom: -25px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.7rem;
    }

    footer {
        padding: 40px;
        text-align: center;
        background: rgba(0,0,0,0.2);
        margin-top: 50px;
    }

    .footer-links { margin-top: 10px; font-size: 0.8rem; opacity: 0.5; }
</style>
<body>

    <header>
        <h1>✨ HabitFlow</h1>
        <p>Turn your intentions into identity.</p>
    </header>

    <main class="container">
        <section class="input-area">
            <input type="text" id="habitInput" placeholder="Enter a new habit...">
            <button onclick="addHabit()">Add Habit</button>
            <button onclick="clearAll()" class="btn-clear">Reset All</button>
        </section>

        <div class="dashboard">
            <div class="column">
                <h2>Daily Quest</h2>
                <div id="pendingHabits" class="habit-list"></div>
            </div>

            <div class="column">
                <h2>Victory Vault</h2>
                <div id="completedHabits" class="habit-list"></div>
            </div>
        </div>

        <section class="stats-container">
            <h3>Weekly Performance</h3>
            <div class="graph" id="progressGraph">
                </div>
        </section>
    </main>

    <footer>
        <p>"Success is the sum of small efforts, repeated day in and day out."</p>
        <small>&copy; 2026 HabitFlow Studio</small>
    </footer>

    <script> 
                // 1. Data Initialization
        let habits = JSON.parse(localStorage.getItem('habitFlowData')) || [];
        let history = JSON.parse(localStorage.getItem('habitFlowHistory')) || {}; 

        // 2. Core Functions
        function updateDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateElement = document.getElementById('currentDateDisplay');
            if (dateElement) {
                dateElement.innerText = new Date().toLocaleDateString(undefined, options);
            }
        }

        function addHabit() {
            const input = document.getElementById('habitInput');
            if (!input.value.trim()) return;

            const newHabit = {
                id: Date.now(),
                name: input.value,
                completedToday: false,
                lastCompletedDate: null,
                streak: 0
            };

            habits.push(newHabit);
            input.value = "";
            saveAndRender();
        }

        function toggleHabit(id) {
            const habit = habits.find(h => h.id === id);
            const todayStr = new Date().toLocaleDateString();
            
            // Calculate Yesterday string for streak validation
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            const yesterdayStr = yesterday.toLocaleDateString();

            if (!habit.completedToday) {
                // If last completion was yesterday, increment streak
                if (habit.lastCompletedDate === yesterdayStr) {
                    habit.streak++;
                } 
                // If they missed days, reset streak to 1
                else if (habit.lastCompletedDate !== todayStr) {
                    habit.streak = 1;
                }
                
                habit.completedToday = true;
                habit.lastCompletedDate = todayStr;
            } else {
                // Undo completion
                habit.completedToday = false;
                // Logic: if they "undo" today, we revert streak to what it was
                if (habit.streak > 0) habit.streak--;
                habit.lastCompletedDate = yesterdayStr; 
            }
            
            saveAndRender();
        }

        function checkDailyReset() {
            const todayStr = new Date().toLocaleDateString();
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            const yesterdayStr = yesterday.toLocaleDateString();

            habits.forEach(h => {
                // If the date has changed since last visit, uncheck the visual 'done' state
                if (h.lastCompletedDate !== todayStr) {
                    h.completedToday = false;
                }
                
                // If the last completion wasn't today AND wasn't yesterday, the streak is broken
                if (h.lastCompletedDate !== todayStr && h.lastCompletedDate !== yesterdayStr) {
                    h.streak = 0;
                }
            });
        }

        function clearAll() {
            if(confirm("This will delete all habits and history. Proceed?")) {
                habits = [];
                history = {};
                localStorage.clear();
                render();
            }
        }

        // 3. Storage & UI Rendering
        function saveAndRender() {
            const todayStr = new Date().toLocaleDateString();
            
            // Update the history object with today's actual performance
            const total = habits.length;
            const done = habits.filter(h => h.completedToday).length;
            const percentage = total > 0 ? Math.round((done / total) * 100) : 0;
            
            history[todayStr] = percentage;

            // Save to LocalStorage
            localStorage.setItem('habitFlowData', JSON.stringify(habits));
            localStorage.setItem('habitFlowHistory', JSON.stringify(history));
            
            render();
        }

        function render() {
            checkDailyReset();
            
            const pendingList = document.getElementById('pendingHabits');
            const completedList = document.getElementById('completedHabits');
            
            if (!pendingList || !completedList) return;

            pendingList.innerHTML = "";
            completedList.innerHTML = "";

            habits.forEach(habit => {
                const item = document.createElement('div');
                item.className = 'habit-item';
                item.innerHTML = `
                    <div>
                        <strong>${habit.name}</strong>
                        <span class="streak-badge">🔥 ${habit.streak}</span>
                    </div>
                    <button onclick="toggleHabit(${habit.id})" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">
                        ${habit.completedToday ? '✨' : '⭕'}
                    </button>
                `;
                
                if (habit.completedToday) {
                    completedList.appendChild(item);
                } else {
                    pendingList.appendChild(item);
                }
            });

            drawGraph();
        }

        // 4. Graph Logic (Strict History)
        function drawGraph() {
            const graph = document.getElementById('progressGraph');
            if (!graph) return;
            
            const daysShort = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const today = new Date();
            graph.innerHTML = "";

            // Generate a rolling 7-day window
            for (let i = 6; i >= 0; i--) {
                const targetDate = new Date();
                targetDate.setDate(today.getDate() - i);
                const dStr = targetDate.toLocaleDateString();
                const dayLabel = daysShort[targetDate.getDay()];
                
                // Fetch actual percentage from our history object
                const percentage = history[dStr] || 0;

                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = `${Math.max(percentage, 5)}%`; // 5% min height for visibility
                bar.setAttribute('data-day', dayLabel);

                // Styling for the current day
                if (i === 0) {
                    bar.style.background = 'var(--accent)';
                    bar.style.boxShadow = '0 0 15px var(--accent)';
                    bar.style.filter = 'brightness(1.2)';
                } else {
                    bar.style.background = 'rgba(255, 255, 255, 0.2)';
                }

                graph.appendChild(bar);
            }
        }

        // 5. App Initialization
        window.onload = () => {
            updateDate();
            render();
        };
    </script>
</body>
</html>
